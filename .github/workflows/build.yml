name: Build Jhalak APK with Logo
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - name: Add Jhalak Logo Icon
        run: |
          pip install Pillow
          python3 << 'PY'
          from PIL import Image
          import glob, os
          files = glob.glob("*.jpg") + glob.glob("*.jpeg") + glob.glob("*.png")
          files = [f for f in files if "android" not in f]
          logo = files[0] if files else None
          print(f"Logo: {logo}")
          if logo:
            im = Image.open(logo).convert("RGBA")
            bg = Image.new("RGBA", (1024,1024), (0,0,0,255))
            im.thumbnail((900,900), Image.LANCZOS)
            bg.paste(im, ((1024-im.width)//2, (1024-im.height)//2), im)
            for d in glob.glob("android/app/src/main/res/mipmap-*"):
              s = 192 if "xxxhdpi" in d else 144 if "xxhdpi" in d else 96 if "xhdpi" in d else 72 if "hdpi" in d else 48
              out = bg.resize((s,s), Image.LANCZOS)
              out.save(os.path.join(d, "ic_launcher.png"))
              out.save(os.path.join(d, "ic_launcher_round.png"))
            print("Icon OK")
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: jhalak-apk-with-logo
          path: build/app/outputs/flutter-apk/app-release.apk
